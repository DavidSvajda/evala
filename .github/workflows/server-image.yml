name: Build Evala server
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope for isolated changes (default full)
        type: choice
        default: full
        options:
          - full
          - accuracy
          - board
          - install
          - account
          - theme
          - security
          - review
          - extension
          - human
          - journey
permissions:
  contents: read
  packages: write
concurrency:
  group: evala-server-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the production branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build application
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Verify application and account isolation
        if: inputs.validation == 'full'
        run: |
          npm run lint
          npm run format:check
          npm test
      - name: Verify accuracy changes
        if: inputs.validation == 'accuracy'
        run: |
          npx eslint src/core/game-accuracy.js src/study/review.js src/study/views/summary.js src/study/locale-en.js tests/accuracy.test.mjs tests/accuracy-smoke.mjs --max-warnings=0
          npx prettier --check src/core/game-accuracy.js src/study/review.js src/study/views/summary.js src/study/locale-en.js tests/accuracy.test.mjs tests/accuracy-smoke.mjs
          node --test tests/accuracy.test.mjs tests/performance.test.mjs
      - name: Verify board gesture changes
        if: inputs.validation == 'board'
        run: |
          npx eslint src/study/board.js tests/board-gestures-smoke.mjs --max-warnings=0
          npx prettier --check src/study/board.js public/study.css tests/board-gestures-smoke.mjs
      - name: Use the runner's installed Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          echo "EVALA_BROWSER_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Verify home screen installation
        if: inputs.validation == 'install'
        run: |
          npx eslint scripts/build.mjs src/study/locale-en.js tests/install-smoke.mjs --max-warnings=0
          npx prettier --check scripts/build.mjs src/study/locale-en.js public/study.html public/app-manifest.json tests/install-smoke.mjs
          node tests/install-smoke.mjs
      - name: Verify core browser flow before publishing
        if: inputs.validation == 'full'
        run: |
          node tests/release-smoke.mjs
          node tests/learning-smoke.mjs
          node tests/storage-browser.mjs
      - name: Verify account experience
        if: inputs.validation == 'account'
        run: |
          npx eslint src/core/account-preferences.js server/account-preferences.mjs server/accounts.mjs src/study/account.js src/study/account-panel.js src/study/audio.js src/study/storage.js src/study/platform.js src/study/app.js src/study/learning-ui.js src/study/locale-en.js tests/account-preferences.test.mjs tests/account-experience-smoke.mjs --max-warnings=0
          npx prettier --check src/core/account-preferences.js server/account-preferences.mjs server/accounts.mjs src/study/account.js src/study/account-panel.js src/study/audio.js src/study/storage.js src/study/platform.js src/study/app.js src/study/learning-ui.js src/study/locale-en.js public/study.html public/study.css tests/account-preferences.test.mjs tests/account-experience-smoke.mjs
          node --test tests/account-preferences.test.mjs tests/accounts.test.mjs
          node tests/account-experience-smoke.mjs
          node tests/storage-browser.mjs
      - name: Verify theme and language changes
        if: inputs.validation == 'theme'
        run: |
          npm run lint
          npm run format:check
          node --test tests/release-version.test.mjs tests/account-preferences.test.mjs
          node tests/theme-locale-smoke.mjs
      - name: Verify game accuracy display
        if: inputs.validation == 'accuracy'
        run: node tests/accuracy-smoke.mjs
      - name: Verify security boundaries
        if: inputs.validation == 'security'
        run: |
          npm run lint
          npm run format:check
          npm audit --audit-level=moderate
          node --test tests/release-version.test.mjs tests/security.test.mjs tests/security-hardening.test.mjs tests/accounts.test.mjs tests/account-preferences.test.mjs tests/public-reports.test.mjs tests/server.test.mjs
          node tests/theme-locale-smoke.mjs
      - name: Verify board gestures
        if: inputs.validation == 'board'
        run: node tests/board-gestures-smoke.mjs
      - name: Verify guided review and release security
        if: inputs.validation == 'review' || inputs.validation == 'extension' || inputs.validation == 'human'
        run: |
          npm run lint
          npm run format:check
          npm audit --audit-level=moderate
          node --test tests/human-opponent.test.mjs tests/core.test.mjs tests/training-follow-through.test.mjs tests/learning.test.mjs tests/coach-review.test.mjs tests/gm-coach.test.mjs tests/performance.test.mjs tests/accuracy.test.mjs tests/release-version.test.mjs tests/security.test.mjs tests/security-hardening.test.mjs tests/accounts.test.mjs tests/public-reports.test.mjs tests/server.test.mjs
          node tests/human-play-smoke.mjs
          node tests/promotion-smoke.mjs
          node tests/bulk-library-smoke.mjs
          node tests/coach-review-smoke.mjs
          node tests/theme-locale-smoke.mjs
      - name: Verify connected learning journey
        if: inputs.validation == 'journey'
        run: |
          npm run lint
          npm run format:check
          npm audit --audit-level=moderate
          node --test tests/imports.test.mjs tests/journey.test.mjs tests/lesson.test.mjs tests/account-preferences.test.mjs tests/learning.test.mjs tests/release-version.test.mjs
          node tests/import-ui-smoke.mjs
          node tests/coach-review-smoke.mjs
          node tests/journey-smoke.mjs
          node tests/board-sizing-smoke.mjs
          node tests/learning-smoke.mjs
      - name: Verify packaged extension and local model switching
        if: inputs.validation == 'extension' || inputs.validation == 'human'
        run: |
          node scripts/package-bar.mjs
          EVALA_EXTENSION_DIR=dist-bar node tests/maia-local-smoke.mjs
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and verify native engine
        run: docker build --platform linux/amd64 --file Dockerfile.azure --build-arg GITHUB_SHA="$GITHUB_SHA" --label org.opencontainers.image.revision="$GITHUB_SHA" --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:server" .
      - name: Smoke test the container
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          docker run -d --memory=4g --cpus=2 --name evala-smoke -p 127.0.0.1:8080:8080 -e API_TOKEN="$token" -e PUBLIC_REPORTS=true -e MAIA_DEBUG=true "$IMAGE:$GITHUB_SHA"
          trap 'docker logs evala-smoke; docker rm -f evala-smoke >/dev/null' EXIT
          for i in {1..30}; do
            if curl --fail --silent --header "Authorization: Bearer $token" http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --header "Authorization: Bearer $token" http://127.0.0.1:8080/api/health
          curl --fail --silent http://127.0.0.1:8080/build.json > build.json
          node --input-type=module -e 'import fs from "node:fs";const build=JSON.parse(fs.readFileSync("build.json","utf8"));if(build.commit!==process.env.GITHUB_SHA)throw Error("Container build metadata does not match the release commit");'
          curl --fail --silent --no-buffer --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data '{"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","settings":{"depth":10,"time":300,"multipv":2}}' \
            http://127.0.0.1:8080/api/analyze > result.ndjson
          node --input-type=module -e 'import fs from "node:fs";const result=fs.readFileSync("result.ndjson","utf8").trim().split("\n").map(JSON.parse).find(x=>x.type==="done");if(!result||result.result.lines.length<2)throw Error("Native engine returned no MultiPV result");console.log("Native Stockfish + API passed");'
          curl --fail --silent --cookie-jar cookies.txt http://127.0.0.1:8080/api/session >/dev/null
          curl --fail --silent --no-buffer --cookie cookies.txt --header 'Content-Type: application/json' \
            --data '{"pgn":"[Event \"Smoke\"]\n[White \"Guest\"]\n[Black \"Opponent\"]\n[Result \"0-1\"]\n\n1. f3 e5 2. g4 Qh4# 0-1","profile":"quick"}' \
            http://127.0.0.1:8080/api/review-game > review.ndjson
          node --input-type=module -e 'import fs from "node:fs";const game=fs.readFileSync("review.ndjson","utf8").trim().split("\n").map(JSON.parse).find(x=>x.type==="game");if(!game?.game.analysis.complete)throw Error("Public game review failed");console.log("Public session + complete native game review passed");'
          for style in natural attacking; do
            curl --fail --silent --max-time 35 --cookie cookies.txt --header 'Content-Type: application/json' \
              --data "{\"initialFen\":\"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1\",\"moves\":[],\"elo\":1400,\"style\":\"$style\"}" \
              http://127.0.0.1:8080/api/opponent/move > human.json
            node --input-type=module -e 'import fs from "node:fs";import {Chess} from "chess.js";const result=JSON.parse(fs.readFileSync("human.json","utf8"));if(result.model!=="Maia-3 5M")throw Error("Wrong human model");const m=result.move;new Chess().move({from:m.slice(0,2),to:m.slice(2,4),promotion:m[4]});console.log("Real Maia CPU response passed");'
          done
          curl --fail --silent http://127.0.0.1:8080/human-source/maia3-source.tar.gz -o maia-source.tar.gz
          test -s maia-source.tar.gz
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.1
      - name: Block vulnerable images and embedded secrets
        run: |
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --format json --output trivy-report.json "$IMAGE:$GITHUB_SHA"
          node scripts/check-trivy.mjs trivy-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-security
          path: trivy-report.json
          retention-days: 14
      - name: Publish tested image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:server"
          echo "Image: $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
