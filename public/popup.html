<!doctype html>
<html lang="cs"
  ><head
    ><meta charset="UTF-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1" /><title>Evala</title
    ><link rel="stylesheet" href="theme.css" /><link rel="stylesheet" href="popup.css" /><script
      src="popup.js"
      type="module"
    ></script></head
  ><body>
    <main>
      <header class="app-header"
        ><div class="brand-mark" aria-hidden="true"></div><h1>Evala<span>Evaluation bar</span></h1
        ><button class="power icon-button" aria-label="Pozastavit engine"></button
      ></header>
      <div class="connection"
        ><span class="connection-dot"></span
        ><span id="connection-text" role="status">Hledám šachovnici…</span
        ><span class="local-tag">LOKÁLNĚ</span></div
      >
      <div class="position-summary"
        ><div class="mini-bar" aria-hidden="true"><div class="mini-white"></div><i></i></div
        ><div
          ><div class="summary-score">—</div
          ><p class="summary-label">Otevři Chess.com nebo Lichess</p
          ><p class="summary-detail">Bar se připojí k viditelné šachovnici.</p></div
        ></div
      >
      <div id="settings"></div>
      <footer
        ><button class="study-link demo-link"
          >Rozebrat moje partie <span class="study-arrow"></span></button
        ><button class="demo-link bar-demo-link"
          >Vyzkoušet evaluation bar <span class="arrow"></span></button
        ><p>Stockfish 19 · bez účtu a poplatků</p
        ><p class="fairplay"
          >Pro rozbor a trénink. Engine při vlastní partii proti člověku pravidla obou webů
          zakazují.</p
        ></footer
      >
    </main></body
  ></html
>
